<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>Jarvis v0.1</title>

<style>
:root {
  --bg: #06070a;
  --panel: #0f131a;
  --border: #1d232e;
  --text: #e7e9ee;
  --dim: #7a8194;
  --primary: #8b9dff;
  --warm: #ff7a59;
  --ok: #5ce0b0;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    sans-serif;
}

button,
input {
  font: inherit;
}

#app {
  display: flex;
  flex-direction: column;
  height: 100vh;
  max-width: 520px;
  margin: auto;
}

.mono {
  font-family:
    ui-monospace,
    SFMono-Regular,
    Menlo,
    monospace;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
}

#title {
  font-size: 14px;
  font-weight: 700;
  letter-spacing: .25em;
}

#status {
  margin-top: 4px;
  font-size: 10px;
  letter-spacing: .15em;
  color: var(--primary);
}

#muteBtn {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: var(--panel);
  border: 1px solid var(--border);
  color: var(--dim);
  cursor: pointer;
}

#orbWrap {
  display: flex;
  justify-content: center;
  padding: 42px 0 25px;
}

#orbOuter {
  position: relative;
  width: 150px;
  height: 150px;
}

.ring {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 1px solid var(--primary);
  opacity: 0;
  animation: pulse 2.2s ease-out infinite;
}

.ring.on {
  opacity: 1;
}

.ring2 {
  animation-delay: .6s;
}

@keyframes pulse {
  0% {
    transform: scale(.9);
    opacity: .55;
  }

  70% {
    transform: scale(1.35);
    opacity: 0;
  }

  100% {
    transform: scale(1.35);
    opacity: 0;
  }
}

#orbCore {
  position: absolute;
  inset: 18px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background:
    radial-gradient(
      circle at 35% 30%,
      #8b9dff55,
      var(--panel) 70%
    );

  display: flex;
  justify-content: center;
  align-items: center;

  box-shadow: 0 0 45px #8b9dff33;

  transition: .3s;
}

#orbDot {
  width: 11px;
  height: 11px;
  border-radius: 50%;
  background: var(--primary);
}

#bars {
  display: none;
  gap: 4px;
  height: 30px;
  align-items: center;
}

#bars span {
  width: 3px;
  height: 26px;
  border-radius: 2px;
  background: var(--warm);
  animation: bars .8s ease-in-out infinite;
}

#bars span:nth-child(2) {
  animation-delay: .1s;
}

#bars span:nth-child(3) {
  animation-delay: .2s;
}

#bars span:nth-child(4) {
  animation-delay: .3s;
}

#bars span:nth-child(5) {
  animation-delay: .4s;
}

@keyframes bars {
  0%, 100% {
    transform: scaleY(.35);
  }

  50% {
    transform: scaleY(1);
  }
}

#transcript {
  flex: 1;
  overflow-y: auto;
  padding: 0 20px;
}

#emptyState {
  text-align: center;
  color: var(--dim);
  font-size: 14px;
  margin-top: 15px;
}

.msg {
  max-width: 85%;
  margin-bottom: 13px;
}

.msg.user {
  margin-left: auto;
  text-align: right;
}

.role {
  font-size: 9px;
  letter-spacing: .15em;
  color: var(--dim);
  margin-bottom: 4px;
}

.bubble {
  display: inline-block;
  padding: 10px 14px;
  border-radius: 14px;
  background: var(--panel);
  border: 1px solid var(--border);
  font-size: 14.5px;
  line-height: 1.5;
  text-align: left;
  white-space: pre-wrap;
}

.msg.user .bubble {
  background: #8b9dff1a;
  border-color: #8b9dff44;
}

#inputBar {
  display: flex;
  gap: 8px;
  align-items: center;
  padding: 12px 16px;
  border-top: 1px solid var(--border);
}

#textInput {
  flex: 1;
  min-width: 0;
  padding: 11px 14px;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: var(--panel);
  color: var(--text);
  outline: none;
}

#sendBtn,
#micBtn {
  border-radius: 50%;
  border: 1px solid var(--border);
  cursor: pointer;
  flex-shrink: 0;
}

#sendBtn {
  width: 42px;
  height: 42px;
  background: var(--panel);
  color: var(--dim);
}

#sendBtn.active {
  background: var(--primary);
  color: #08090d;
}

#micBtn {
  width: 50px;
  height: 50px;
  background: var(--primary);
  color: #08090d;
  border: none;
}

#micBtn.listening {
  background: var(--warm);
}

#notice {
  display: none;
  text-align: center;
  color: var(--dim);
  font-size: 11px;
  padding: 0 20px 8px;
}
</style>
</head>

<body>

<div id="app">

<header>
  <div>
    <div id="title" class="mono">JARVIS</div>
    <div id="status" class="mono">STANDING BY</div>
  </div>

  <button id="muteBtn">🔊</button>
</header>

<div id="orbWrap">

  <div id="orbOuter">

    <div class="ring" id="ring1"></div>
    <div class="ring ring2" id="ring2"></div>

    <div id="orbCore">

      <div id="orbDot"></div>

      <div id="bars">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
      </div>

    </div>

  </div>

</div>

<div id="transcript">
  <div id="emptyState">
    Mic dabao aur Jarvis se baat karo.
  </div>
</div>

<div id="notice">
  Voice recognition is not supported in this browser.
</div>

<div id="inputBar">

  <input
    id="textInput"
    type="text"
    placeholder="Type a message..."
  >

  <button id="sendBtn">➤</button>

  <button id="micBtn">🎙️</button>

</div>

</div>

<script>

let messages = [];
let status = "idle";
let voiceOn = true;

const statusEl = document.getElementById("status");
const orbCore = document.getElementById("orbCore");
const orbDot = document.getElementById("orbDot");
const bars = document.getElementById("bars");
const ring1 = document.getElementById("ring1");
const ring2 = document.getElementById("ring2");

const transcriptEl =
  document.getElementById("transcript");

const emptyState =
  document.getElementById("emptyState");

const textInput =
  document.getElementById("textInput");

const sendBtn =
  document.getElementById("sendBtn");

const micBtn =
  document.getElementById("micBtn");

const muteBtn =
  document.getElementById("muteBtn");


function setStatus(s) {

  status = s;

  const labels = {
    idle: "STANDING BY",
    listening: "LISTENING",
    thinking: "THINKING",
    speaking: "SPEAKING"
  };

  statusEl.textContent = labels[s];

  const color =
    s === "listening"
      ? "#ff7a59"
      : s === "speaking"
      ? "#5ce0b0"
      : "#8b9dff";

  statusEl.style.color = color;

  orbCore.style.boxShadow =
    "0 0 45px " + color + "33";

  orbCore.style.background =
    "radial-gradient(circle at 35% 30%, "
    + color + "55, #0F131A 70%)";

  orbDot.style.background = color;

  ring1.style.borderColor = color;
  ring2.style.borderColor = color;

  const active =
    s === "listening" ||
    s === "speaking";

  ring1.classList.toggle("on", active);
  ring2.classList.toggle("on", active);

  bars.style.display =
    s === "listening"
      ? "flex"
      : "none";

  orbDot.style.display =
    s === "listening"
      ? "none"
      : "block";

  micBtn.classList.toggle(
    "listening",
    s === "listening"
  );

  micBtn.textContent =
    s === "listening"
      ? "■"
      : "🎙️";
}


function renderMessages() {

  if (messages.length === 0) {

    emptyState.style.display = "block";

    transcriptEl
      .querySelectorAll(".msg")
      .forEach(el => el.remove());

    return;
  }

  emptyState.style.display = "none";

  transcriptEl
    .querySelectorAll(".msg")
    .forEach(el => el.remove());

  messages.forEach(m => {

    const div =
      document.createElement("div");

    div.className =
      "msg " +
      (m.role === "user"
        ? "user"
        : "assistant");

    const role =
      document.createElement("div");

    role.className = "role mono";

    role.textContent =
      m.role === "user"
        ? "YOU"
        : "JARVIS";

    const bubble =
      document.createElement("div");

    bubble.className = "bubble";

    bubble.textContent = m.content;

    div.appendChild(role);
    div.appendChild(bubble);

    transcriptEl.appendChild(div);

  });

  transcriptEl.scrollTop =
    transcriptEl.scrollHeight;
}


function speak(text) {

  if (
    !voiceOn ||
    !window.speechSynthesis
  ) {
    setStatus("idle");
    return;
  }

  window.speechSynthesis.cancel();

  const utter =
    new SpeechSynthesisUtterance(text);

  utter.rate = 1.02;
  utter.pitch = .95;

  utter.onstart =
    () => setStatus("speaking");

  utter.onend =
    () => setStatus("idle");

  utter.onerror =
    () => setStatus("idle");

  window.speechSynthesis.speak(utter);
}


async function handleSend(text) {

  const trimmed =
    String(text || "").trim();

  if (!trimmed) return;

  messages.push({
    role: "user",
    content: trimmed
  });

  renderMessages();

  textInput.value = "";

  sendBtn.classList.remove("active");

  setStatus("thinking");

  try {

    const response =
  await fetch("https://jarvis-backend.muhammadnasrullahkhan77.workers.dev/api/chat", {

        method: "POST",

        headers: {
          "Content-Type":
            "application/json"
        },

        body: JSON.stringify({
          message: trimmed
        })
      });

    const data =
      await response.json();

    if (!response.ok) {
      throw new Error(
        data.error ||
        "AI request failed"
      );
    }

    const reply =
      data.reply ||
      "Mujhe jawab nahi mila.";

    messages.push({
      role: "assistant",
      content: reply
    });

    renderMessages();

    speak(reply);

  } catch (error) {

    console.error(error);

    const reply =
      "Jarvis ka AI brain abhi connect nahi ho raha. Backend aur AI key check karo.";

    messages.push({
      role: "assistant",
      content: reply
    });

    renderMessages();

    speak(reply);

    setStatus("idle");
  }
}


sendBtn.addEventListener(
  "click",
  () => handleSend(textInput.value)
);


textInput.addEventListener(
  "keydown",
  event => {

    if (event.key === "Enter") {
      handleSend(textInput.value);
    }

  }
);


textInput.addEventListener(
  "input",
  () => {

    sendBtn.classList.toggle(
      "active",
      textInput.value.trim().length > 0
    );

  }
);


muteBtn.addEventListener(
  "click",
  () => {

    voiceOn = !voiceOn;

    if (!voiceOn) {
      window.speechSynthesis?.cancel();
    }

    muteBtn.textContent =
      voiceOn ? "🔊" : "🔇";

  }
);


// Voice recognition

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

let recognition = null;

if (SpeechRecognition) {

  recognition =
    new SpeechRecognition();

  recognition.continuous = false;
  recognition.interimResults = false;

  // Roman Urdu / Urdu / English ko browser
  // automatically recognize karne ki koshish karega.
  recognition.lang = "en-US";

  recognition.onstart =
    () => setStatus("listening");

  recognition.onresult =
    event => {

      const transcript =
        event.results[0][0].transcript;

      handleSend(transcript);
    };

  recognition.onerror =
    () => setStatus("idle");

  recognition.onend =
    () => {

      if (status === "listening") {
        setStatus("idle");
      }

    };

} else {

  document.getElementById(
    "notice"
  ).style.display = "block";

  micBtn.style.opacity = ".4";
}


micBtn.addEventListener(
  "click",
  () => {

    if (!recognition) return;

    if (status === "listening") {

      recognition.stop();

      setStatus("idle");

      return;
    }

    try {
      recognition.start();
    } catch (error) {
      console.log(error);
    }

  }
);


setStatus("idle");

</script>

</body>
</html>
