<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>JARVIS v0.1</title>

<style>
:root {
  --bg: #06070A;
  --panel: #0F131A;
  --border: #1D232E;
  --text: #E7E9EE;
  --dim: #7A8194;
  --primary: #8B9DFF;
  --warm: #FF7A59;
  --ok: #5CE0B0;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

body {
  overflow: hidden;
}

#app {
  display: flex;
  flex-direction: column;
  height: 100vh;
  max-width: 480px;
  margin: 0 auto;
}

.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
}

/* HEADER */

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
}

#title {
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.25em;
}

#status {
  font-size: 10px;
  letter-spacing: 0.15em;
  margin-top: 3px;
  color: var(--primary);
}

#muteBtn {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--panel);
  border: 1px solid var(--border);
  color: var(--dim);
  font-size: 16px;
  cursor: pointer;
}

/* ORB */

#orbWrap {
  display: flex;
  justify-content: center;
  padding: 40px 0 24px;
}

#orbOuter {
  position: relative;
  width: 140px;
  height: 140px;
}

.ring {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 1.5px solid var(--primary);
  animation: pulseRing 2.2s ease-out infinite;
  opacity: 0;
}

.ring.on {
  opacity: 1;
}

.ring2 {
  animation-delay: 0.6s;
}

@keyframes pulseRing {
  0% {
    transform: scale(0.9);
    opacity: 0.55;
  }

  70% {
    transform: scale(1.35);
    opacity: 0;
  }

  100% {
    transform: scale(1.35);
    opacity: 0;
  }
}

#orbCore {
  position: absolute;
  inset: 18px;
  border-radius: 50%;
  background:
    radial-gradient(
      circle at 35% 30%,
      #8B9DFF55,
      var(--panel) 70%
    );

  border: 1px solid var(--border);

  display: flex;
  align-items: center;
  justify-content: center;

  box-shadow: 0 0 40px #8B9DFF33;

  transition:
    box-shadow 0.3s ease,
    background 0.3s ease;
}

#orbDot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--primary);
}

#bars {
  display: none;
  gap: 4px;
  align-items: center;
  height: 30px;
}

#bars span {
  width: 3px;
  height: 26px;
  border-radius: 2px;
  background: var(--warm);
  animation: barPulse 0.9s ease-in-out infinite;
}

#bars span:nth-child(2) {
  animation-delay: 0.12s;
}

#bars span:nth-child(3) {
  animation-delay: 0.24s;
}

#bars span:nth-child(4) {
  animation-delay: 0.36s;
}

#bars span:nth-child(5) {
  animation-delay: 0.48s;
}

@keyframes barPulse {
  0%, 100% {
    transform: scaleY(0.4);
  }

  50% {
    transform: scaleY(1);
  }
}

/* CHAT */

#transcript {
  flex: 1;
  overflow-y: auto;
  padding: 0 20px;
  min-height: 0;
}

#emptyState {
  color: var(--dim);
  font-size: 14px;
  text-align: center;
  margin-top: 12px;
  line-height: 1.6;
}

.msg {
  max-width: 82%;
  margin-bottom: 12px;
}

.msg.user {
  margin-left: auto;
  text-align: right;
}

.msg .role {
  font-size: 9px;
  letter-spacing: 0.15em;
  color: var(--dim);
  margin-bottom: 4px;
}

.msg .bubble {
  border-radius: 14px;
  padding: 10px 14px;
  font-size: 14.5px;
  line-height: 1.5;
  background: var(--panel);
  border: 1px solid var(--border);
  display: inline-block;
  text-align: left;
}

.msg.user .bubble {
  background: #8B9DFF1A;
  border-color: #8B9DFF44;
}

/* INPUT */

#inputBar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px 16px;
  border-top: 1px solid var(--border);
  background: var(--bg);
}

#textInput {
  flex: 1;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 10px 14px;
  color: var(--text);
  font-size: 14px;
  outline: none;
}

#textInput:focus {
  border-color: var(--primary);
}

#sendBtn,
#micBtn {
  flex-shrink: 0;
  border-radius: 50%;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

#sendBtn {
  width: 40px;
  height: 40px;
  background: var(--panel);
  border: 1px solid var(--border);
  color: var(--dim);
  font-size: 16px;
}

#sendBtn.active {
  background: var(--primary);
  color: #0A0A0F;
}

#micBtn {
  width: 48px;
  height: 48px;
  background: var(--primary);
  color: #0A0A0F;
  border: none;
  font-size: 18px;
}

#micBtn.listening {
  background: var(--warm);
}

#notice {
  font-size: 11px;
  color: var(--dim);
  text-align: center;
  padding: 0 20px 8px;
}
</style>
</head>

<body>

<div id="app">

  <header>

    <div>
      <div id="title" class="mono">
        JARVIS
      </div>

      <div id="status" class="mono">
        STANDING BY
      </div>
    </div>

    <button id="muteBtn">
      🔊
    </button>

  </header>


  <div id="orbWrap">

    <div id="orbOuter">

      <div class="ring" id="ring1"></div>

      <div class="ring ring2" id="ring2"></div>

      <div id="orbCore">

        <div id="orbDot"></div>

        <div id="bars">
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
        </div>

      </div>

    </div>

  </div>


  <div id="transcript">

    <div id="emptyState">
      Tap the mic and talk, or type below.
    </div>

  </div>


  <div
    id="notice"
    style="display:none;"
  >
    Voice input isn't supported in this browser.
  </div>


  <div id="inputBar">

    <input
      id="textInput"
      type="text"
      placeholder="Type a message"
      autocomplete="off"
    >

    <button id="sendBtn">
      ➤
    </button>

    <button id="micBtn">
      🎙️
    </button>

  </div>

</div>


<script>

const COLORS = {
  primary: '#8B9DFF',
  warm: '#FF7A59',
  ok: '#5CE0B0'
};

let messages = [];

let status = 'idle';

let voiceOn = true;

let userName = localStorage.getItem('jarvis_user_name') || '';


// ELEMENTS

const statusEl =
  document.getElementById('status');

const orbCore =
  document.getElementById('orbCore');

const orbDot =
  document.getElementById('orbDot');

const bars =
  document.getElementById('bars');

const ring1 =
  document.getElementById('ring1');

const ring2 =
  document.getElementById('ring2');

const transcriptEl =
  document.getElementById('transcript');

const emptyState =
  document.getElementById('emptyState');

const textInput =
  document.getElementById('textInput');

const sendBtn =
  document.getElementById('sendBtn');

const micBtn =
  document.getElementById('micBtn');

const muteBtn =
  document.getElementById('muteBtn');


// STATUS

function setStatus(s) {

  status = s;

  const labels = {

    idle: 'STANDING BY',

    listening: 'LISTENING',

    thinking: 'THINKING',

    speaking: 'SPEAKING'

  };

  statusEl.textContent =
    labels[s] || 'STANDING BY';


  const color =
    s === 'listening'
      ? COLORS.warm
      : s === 'speaking'
        ? COLORS.ok
        : COLORS.primary;


  statusEl.style.color = color;

  orbCore.style.boxShadow =
    '0 0 40px ' + color + '33';

  orbCore.style.background =
    'radial-gradient(circle at 35% 30%, ' +
    color +
    '55, #0F131A 70%)';

  orbDot.style.background = color;

  ring1.style.borderColor = color;

  ring2.style.borderColor = color;


  const showRings =
    s === 'listening' ||
    s === 'speaking';


  ring1.classList.toggle(
    'on',
    showRings
  );

  ring2.classList.toggle(
    'on',
    showRings
  );


  bars.style.display =
    s === 'listening'
      ? 'flex'
      : 'none';


  orbDot.style.display =
    s === 'listening'
      ? 'none'
      : 'block';


  micBtn.classList.toggle(
    'listening',
    s === 'listening'
  );


  micBtn.innerHTML =
    s === 'listening'
      ? '■'
      : '🎙️';

}


// MESSAGES

function renderMessages() {

  if (messages.length === 0) {

    emptyState.style.display =
      'block';

    return;
  }


  emptyState.style.display =
    'none';


  transcriptEl
    .querySelectorAll('.msg')
    .forEach(el => el.remove());


  messages.forEach(message => {

    const div =
      document.createElement('div');

    div.className =
      'msg ' +
      (
        message.role === 'user'
          ? 'user'
          : 'assistant'
      );


    const role =
      document.createElement('div');

    role.className =
      'role mono';

    role.textContent =
      message.role === 'user'
        ? 'YOU'
        : 'JARVIS';


    const bubble =
      document.createElement('div');

    bubble.className =
      'bubble';

    bubble.textContent =
      message.content;


    div.appendChild(role);

    div.appendChild(bubble);

    transcriptEl.appendChild(div);

  });


  transcriptEl.scrollTop =
    transcriptEl.scrollHeight;

}


// SPEECH

function speak(text) {

  if (
    !voiceOn ||
    !window.speechSynthesis
  ) {

    setStatus('idle');

    return;
  }


  window.speechSynthesis.cancel();


  const utterance =
    new SpeechSynthesisUtterance(text);


  utterance.rate = 1.02;

  utterance.pitch = 0.95;


  utterance.onstart =
    () => setStatus('speaking');


  utterance.onend =
    () => setStatus('idle');


  utterance.onerror =
    () => setStatus('idle');


  window.speechSynthesis.speak(
    utterance
  );

}


// LOCAL JARVIS BRAIN

function getJarvisReply(message) {

  const text =
    message.toLowerCase().trim();


  // NAME

  if (
    text.includes('my name is ')
  ) {

    const name =
      message
        .substring(
          text.indexOf('my name is ') +
          11
        )
        .trim();


    if (name) {

      userName = name;

      localStorage.setItem(
        'jarvis_user_name',
        name
      );


      return (
        'Nice to meet you, ' +
        name +
        '. I will remember your name.'
      );

    }

  }


  if (
    text.includes('mera naam ')
  ) {

    const name =
      message
        .split('mera naam')[1]
        .replace(/hai/gi, '')
        .trim();


    if (name) {

      userName = name;

      localStorage.setItem(
        'jarvis_user_name',
        name
      );


      return (
        'Theek hai ' +
        name +
        '. Main aap ka naam yaad rakhunga.'
      );

    }

  }


  // GREETING

  if (
    text === 'hello' ||
    text === 'hi' ||
    text.includes('hello jarvis') ||
    text.includes('hi jarvis')
  ) {

    if (userName) {

      return (
        'Hello ' +
        userName +
        '. I am Jarvis. How can I help you?'
      );

    }


    return (
      'Hello. I am Jarvis. How can I help you?'
    );

  }


  // NAME QUESTION

  if (
    text.includes('what is my name') ||
    text.includes('mera naam kya hai') ||
    text.includes('do you know my name')
  ) {

    if (userName) {

      return (
        'Your name is ' +
        userName +
        '.'
      );

    }


    return (
      'I do not know your name yet. Tell me, my name is followed by your name.'
    );

  }


  // WHO ARE YOU

  if (
    text.includes('who are you') ||
    text.includes('your name')
  ) {

    return (
      'I am Jarvis, your personal assistant.'
    );

  }


  // HOW ARE YOU

  if (
    text.includes('how are you')
  ) {

    return (
      'I am online and ready to help.'
    );

  }


  // TIME

  if (
    text.includes('what time') ||
    text === 'time' ||
    text.includes('current time')
  ) {

    const time =
      new Date().toLocaleTimeString(
        [],
        {
          hour: 'numeric',
          minute: '2-digit'
        }
      );


    return (
      'The current time is ' +
      time +
      '.'
    );

  }


  // DATE

  if (
    text.includes('what date') ||
    text.includes("today's date") ||
    text.includes('today date')
  ) {

    const date =
      new Date().toLocaleDateString(
        [],
        {
          weekday: 'long',
          year: 'numeric',
          month: 'long',
          day: 'numeric'
        }
      );


    return (
      'Today is ' +
      date +
      '.'
    );

  }


  // THANKS

  if (
    text.includes('thank you') ||
    text.includes('thanks')
  ) {

    return (
      'You are welcome. I am here to help.'
    );

  }


  // BYE

  if (
    text === 'bye' ||
    text.includes('goodbye')
  ) {

    return (
      'Goodbye. I will be here when you need me.'
    );

  }


  // TEST

  if (
    text.includes('test')
  ) {

    return (
      'Systems are working. Jarvis version zero point one is online.'
    );

  }


  // DEFAULT

  return (
    'I heard you say: ' +
    message +
    '. I am still a simple local Jarvis, but I am ready for my next upgrade.'
  );

}


// SEND MESSAGE

function handleSend(text) {

  const trimmed =
    (text || '').trim();


  if (!trimmed) return;


  messages.push({

    role: 'user',

    content: trimmed

  });


  renderMessages();


  textInput.value = '';

  sendBtn.classList.remove(
    'active'
  );


  setStatus('thinking');


  setTimeout(() => {

    const reply =
      getJarvisReply(trimmed);


    messages.push({

      role: 'assistant',

      content: reply

    });


    renderMessages();


    speak(reply);


    if (
      !voiceOn ||
      !window.speechSynthesis
    ) {

      setStatus('idle');

    }

  }, 500);

}


// SEND BUTTON

sendBtn.addEventListener(
  'click',
  () => {

    handleSend(
      textInput.value
    );

  }
);


// ENTER KEY

textInput.addEventListener(
  'keydown',
  event => {

    if (event.key === 'Enter') {

      handleSend(
        textInput.value
      );

    }

  }
);


// INPUT BUTTON

textInput.addEventListener(
  'input',
  () => {

    sendBtn.classList.toggle(
      'active',
      textInput.value.trim().length > 0
    );

  }
);


// MUTE

muteBtn.addEventListener(
  'click',
  () => {

    voiceOn = !voiceOn;


    if (
      !voiceOn &&
      window.speechSynthesis
    ) {

      window.speechSynthesis.cancel();

    }


    muteBtn.innerHTML =
      voiceOn
        ? '🔊'
        : '🔇';

  }
);


// SPEECH RECOGNITION

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


let recognition = null;


if (SpeechRecognition) {

  recognition =
    new SpeechRecognition();


  recognition.continuous =
    false;


  recognition.interimResults =
    false;


  recognition.lang =
    'en-US';


  recognition.onstart =
    () => {

      setStatus('listening');

    };


  recognition.onresult =
    event => {

      const spokenText =
        event.results[0][0].transcript;


      handleSend(
        spokenText
      );

    };


  recognition.onerror =
    event => {

      console.log(
        'Speech error:',
        event.error
      );


      setStatus('idle');

    };


  recognition.onend =
    () => {

      if (
        status === 'listening'
      ) {

        setStatus('idle');

      }

    };


  micBtn.addEventListener(
    'click',
    () => {

      if (
        status === 'listening'
      ) {

        recognition.stop();

        return;

      }


      try {

        recognition.start();

      } catch (error) {

        console.log(error);

      }

    }
  );

} else {

  document.getElementById(
    'notice'
  ).style.display = 'block';


  micBtn.style.opacity =
    '0.5';

}


// START

setStatus('idle');

</script>

</body>
</html>
